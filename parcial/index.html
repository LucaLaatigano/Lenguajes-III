<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripción al Curso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen py-12 px-4 flex flex-col items-center">
    <div class="w-full mx-5 max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Inscripción al Curso</h1>
        </div>
        <div class="bg-gray-200 rounded-2xl p-8">
            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre y Apellido</label>
                <input id="nombre" required type="text" placeholder="Ej: Franco Tejerina"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none" />
                <span id="error-nombre" class="block mt-1 text-xs text-red-500 h-5"></span>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-700 mb-1">DNI</label>
                <input id="dni" type="text" required placeholder="12345678"
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none" />
                <span id="error-dni" class="block mt-1 text-xs text-red-500 h-5"></span>
            </div>

            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-700 mb-1" for="fecha">Fecha de Nacimiento</label>
                <input id="fecha" type="date" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-3 text-sm outline-none" />
                <span id="error-fecha" class="block mt-1 text-xs text-red-500 h-5"></span>
            </div>

            <div class="flex gap-3">
                <button id="btn-enviar" class="flex-1 bg-blue-600 text-white font-semibold text-sm py-3 rounded-lg">
                    Enviar
                </button>
                <button id="btn-preguntas"
                    class="flex-1 bg-blue-600 text-white text-gray-700 font-semibold text-sm py-3 rounded-lg">
                    Preguntas
                </button>
            </div>

            <div id="mensaje-exito"
                class="hidden mt-4 bg-green-50 border border-green-200 text-green-700 font-semibold text-sm px-4 py-3 rounded-lg">
            </div>

        </div>
        <div id="respuestas-div" class="hidden bg-gray-200 rounded-2xl shadow-md p-8 mt-4">
            <h3 class="text-xs font-bold uppercase text-blue-600 mb-4">Respuestas</h3>
            <div id="respuestas-cotenido" class="space-y-2 text-sm text-gray-700"></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
