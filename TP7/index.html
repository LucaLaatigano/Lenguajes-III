<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Buscador de Personajes</title>
</head>

<body class="flex flex-col items-center h-screen bg-gray-100">
    <div class="flex flex-col items-center bg-white p-6 rounded-lg shadow-lg w-full h-full gap-5">
        <div class="p-3 flex items-center flex-col gap-2">
            <h1 class="text-5xl text-green-600 text-center font-bold mb-4">Buscador de Personajes</h1>
            <span class="text-blue-600 text-center text-lg text-center">Rick and Morty Universe — API Explorer</span>
        </div>
        <div class="flex flex-col w-full h-auto max-w-2xl">
            <form id="searchForm">
                <input id="inp-el" type="text" placeholder="Escribe el nombre del personaje..."
                    class="w-full p-2 border outline-none border-gray-300 rounded mb-4">
                <button id="btn-el" type="submit"
                    class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">Buscar</button>
            </form>
        </div>
        <div id="card-container" class="flex flex-wrap gap-3 h-auto w-full max-w-4xl overflow-y-auto p-3"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
